name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # Fast feedback on every push: builds/tests everything SwiftPM can build
  # without Xcode (ElectricalCore, CircuitMNA, ScenarioEngine, and the
  # platform-independent pure logic inside RealityScene/MetalTelemetry —
  # their SwiftUI/RealityKit/MetalKit-guarded code compiles to nothing here,
  # by design, since those APIs don't exist on Linux). Also runs the
  # project's own Python physics/reachability validators.
  linux-swiftpm:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Python (not present in the swift:6.0 image)
        run: apt-get update && apt-get install -y python3
      - name: swift build (all targets)
        run: swift build
      - name: swift test (all targets)
        run: swift test
      - name: Python validators
        run: |
          for f in Scripts/validate_causal_depth86.py \
                   Scripts/validate_continuous_causal_machine85.py \
                   Scripts/validate_unified_truth.py \
                   Scripts/validate_reality_scene.py \
                   Scripts/validate_metal_telemetry.py \
                   Scripts/validate_coal_mining.py \
                   Scripts/validate_causal_interaction93.py \
                   Scripts/validate_facility_power88.py \
                   Scripts/validate_immersive_twin.py \
                   Scripts/validate_immersive_visuals91.py \
                   Scripts/validate_physical_commissioning.py \
                   Scripts/validate_physical_interaction90.py \
                   Scripts/validate_physical_network87.py \
                   Scripts/validate_production_art92.py \
                   Scripts/validate_reality_twin.py \
                   Scripts/validate_visual_fidelity89.py; do
            echo "== $f =="
            python3 "$f"
          done

  # Authoritative check: the SwiftUI/RealityKit/Metal code the Linux job
  # can't see at all. This is the job that would have caught the
  # RealityView update-closure arity bug and the missing alpha-blending
  # bug, both of which shipped once already because no CI existed to catch
  # them before a manual Xcode build did. Builds for Mac Catalyst rather
  # than an iOS Simulator destination — see the comment on the build step
  # for why.
  macos-xcode:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      # iOS Simulator destinations require a runtime download this runner
      # image doesn't ship with by default (multi-GB, slow/flaky in CI).
      # Mac Catalyst is always immediately available on any macOS runner
      # with the matching Xcode installed, and — since
      # SUPPORTS_MACCATALYST: YES is already set on every target in
      # project.yml — type-checks exactly the same Swift/SwiftUI/
      # RealityKit/MetalKit code as an iOS build would. If you need an
      # actual iOS Simulator run (e.g. to catch a Catalyst-only behavior
      # difference), add `xcodebuild -downloadPlatform iOS` first.
      - name: Build for Mac Catalyst
        run: |
          xcodebuild -project ElectricEngineerGame.xcodeproj \
            -scheme ElectricEngineerGame \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            build \
            CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        run: |
          xcodebuild -project ElectricEngineerGame.xcodeproj \
            -scheme ElectricEngineerGame \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            test \
            CODE_SIGNING_ALLOWED=NO

  # Non-blocking: swiftlint exits nonzero on ANY violation including plain
  # warnings, and this 93-revision codebase has real ones (e.g. a genuine
  # force_unwrapping hit) mixed with formatting noise .swiftlint.yml already
  # can't fully silence without disabling the rule outright. continue-on-error
  # keeps this visible in the Actions UI without blocking the pipeline on
  # pre-existing style debt this task isn't scoped to fix.
  swiftlint:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --quiet
