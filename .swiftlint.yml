excluded:
  - .build
  - Scripts

# The existing engine/UI code is written in a very dense, single-line style
# (some files exceed 1,000 columns on one line). Style rules that would
# flag that on every line are disabled here rather than silenced per-file,
# so lint stays useful for real issues instead of drowning in noise.
disabled_rules:
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - function_parameter_count
  - cyclomatic_complexity
  - large_tuple
  - nesting
  - todo
  # Real CI run (first one, on the code this file already governs) surfaced
  # ~180 warnings from these — all pure formatting on the same dense
  # single-line style above, none a correctness signal. Disabled for the
  # same reason as the length/complexity rules: they'd fire on nearly every
  # existing line rather than flagging anything actionable.
  - opening_brace
  - return_arrow_whitespace
  - colon
  - comma
  - statement_position
  - switch_case_alignment

opt_in_rules:
  # CLAUDE.md: omit explicit `return` in single-expression functions.
  - implicit_return
  - empty_count
  - force_unwrapping

identifier_name:
  min_length: 1
  excluded:
    - id
    - dt
